[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disu-slope-corrector"
version = "0.2.0"
description = "Slope-aware geometric correction for layered DISU groundwater models (MF6 and MFUSG)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ali Shokri", email = "a.shokri@yahoo.com" },
]
keywords = ["groundwater", "modflow", "disu", "unstructured", "voronoi", "vertical-conductance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.22",
    "flopy>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
disu-slope-correct = "disu_slope_corrector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
